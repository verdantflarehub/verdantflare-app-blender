name: Blender
on:
  push:
    branches: [release]
permissions:
  contents: read
concurrency:
  group: blender-release
  cancel-in-progress: false
env:
  REGISTRY_ENDPOINT: ${{ secrets.REGISTRY_ENDPOINT_ALIYUN }}
  IMAGE_NAME: wod/verdantflare-app
  VERSION: 0.1.3
jobs:
  image:
    name: Build and publish ${{ matrix.component }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: blender
            dockerfile: Dockerfile
          - component: blender-worker
            dockerfile: Dockerfile.worker
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Configure release destination
        id: image
        shell: bash
        run: |
          set -euo pipefail
          endpoint="${REGISTRY_ENDPOINT%/}"
          [[ "$endpoint" =~ ^[a-zA-Z0-9.-]+(:[0-9]+)?$ ]] || exit 1
          echo "endpoint=$endpoint" >> "$GITHUB_OUTPUT"
          echo "tag=$endpoint/$IMAGE_NAME:${{ matrix.component }}-v$VERSION" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ${{ steps.image.outputs.endpoint }}
          username: ${{ secrets.REGISTRY_USER_ALIYUN }}
          password: ${{ secrets.REGISTRY_PASSWORD_ALIYUN }}
      - name: Refuse an existing release tag
        env:
          IMAGE: ${{ steps.image.outputs.tag }}
        run: bash scripts/check-image-absent.sh
      - name: Build and publish versioned image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          provenance: false
          sbom: false
