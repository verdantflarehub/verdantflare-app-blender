[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisord]
logfile=/tmp/supervisord.log
logfile_maxbytes=5MB
logfile_backups=0
loglevel=info
pidfile=/tmp/supervisord.pid
childlogdir=/tmp
nodaemon=true

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:dbus-session]
command=bash -c ". /etc/beagle-wind-vnc/runtime-env.sh; mkdir -pm700 \"${XDG_RUNTIME_DIR}\"; rm -f \"${XDG_RUNTIME_DIR}/bus\"; dbus-daemon --session --nofork --nopidfile --address=\"${DBUS_SESSION_BUS_ADDRESS}\""
stdout_logfile=/tmp/blender-mcp-dbus-session.log
redirect_stderr=true
stopasgroup=true
stopsignal=INT
autostart=true
autorestart=true
priority=1

[program:dbus-system]
command=bash -c ". /etc/beagle-wind-vnc/runtime-env.sh; sudo mkdir -pm755 /run/dbus; sudo rm -f /run/dbus/system_bus_socket; sudo dbus-daemon --system --nofork --nopidfile --nosyslog --address=\"${DBUS_SYSTEM_BUS_ADDRESS}\""
stdout_logfile=/tmp/blender-mcp-dbus-system.log
redirect_stderr=true
stopasgroup=true
stopsignal=INT
autostart=true
autorestart=true
priority=1

[program:pipewire]
command=bash -c ". /etc/beagle-wind-vnc/runtime-env.sh; until [ -S \"${XDG_RUNTIME_DIR}/bus\" ]; do sleep 0.5; done; exec /usr/bin/pipewire"
stdout_logfile=/tmp/blender-mcp-pipewire.log
redirect_stderr=true
stopasgroup=true
stopsignal=INT
autostart=true
autorestart=true
priority=10

[program:wireplumber]
command=bash -c ". /etc/beagle-wind-vnc/runtime-env.sh; until [ -S \"${XDG_RUNTIME_DIR}/pipewire-0\" ]; do sleep 0.5; done; exec /usr/bin/wireplumber"
stdout_logfile=/tmp/blender-mcp-wireplumber.log
redirect_stderr=true
stopasgroup=true
stopsignal=INT
autostart=true
autorestart=true
priority=11

[program:pipewire-pulse]
command=bash -c ". /etc/beagle-wind-vnc/runtime-env.sh; until [ -S \"${XDG_RUNTIME_DIR}/pipewire-0\" ]; do sleep 0.5; done; exec /usr/bin/pipewire-pulse"
stdout_logfile=/tmp/blender-mcp-pipewire-pulse.log
redirect_stderr=true
stopasgroup=true
stopsignal=INT
autostart=true
autorestart=true
priority=12

[program:smithay-display]
command=bash -c ". /etc/beagle-wind-vnc/runtime-env.sh; exec /etc/beagle-wind-vnc/start-smithay-display.sh"
stdout_logfile=/tmp/blender-mcp-smithay.log
redirect_stderr=true
stopasgroup=true
stopsignal=INT
autostart=true
autorestart=true
priority=15

[program:kwin-wayland]
command=bash -c ". /etc/beagle-wind-vnc/runtime-env.sh; until [ -S \"${XDG_RUNTIME_DIR}/bus\" ] && [ -r \"${BDWIND_SMITHAY_READY_FILE}\" ] && [ -S \"${BDWIND_SMITHAY_CONTROL_SOCKET}\" ]; do sleep 0.2; done; exec /etc/beagle-wind-vnc/start-kwin-wayland.sh"
stdout_logfile=/tmp/blender-mcp-kwin.log
redirect_stderr=true
stopasgroup=true
stopsignal=INT
autostart=true
autorestart=true
priority=20

[program:blender]
command=/opt/beagle/blender-mcp/blender-run.sh
stdout_logfile=/tmp/blender-mcp-blender.log
redirect_stderr=true
stopasgroup=true
stopsignal=INT
autostart=true
autorestart=false
priority=30

[program:instance-control]
command=python3 /opt/beagle/blender-mcp/instance-control/server.py
stdout_logfile=/tmp/blender-mcp-bridge.log
redirect_stderr=true
stopasgroup=true
stopsignal=TERM
autostart=true
autorestart=true
priority=40

[program:file-agent]
command=python3 /opt/beagle/blender-mcp/file-agent/server.py
stdout_logfile=/tmp/blender-mcp-file-agent.log
redirect_stderr=true
stopasgroup=true
stopsignal=TERM
autostart=true
autorestart=true
priority=41

[program:start-webrtc]
command=bash -c ". /etc/beagle-wind-vnc/runtime-env.sh; exec /etc/beagle-wind-vnc/start-webrtc.sh"
stdout_logfile=/tmp/blender-mcp-webrtc.log
redirect_stderr=true
stopasgroup=true
stopsignal=INT
autostart=false
autorestart=true
stopwaitsecs=5
killasgroup=true
priority=50
